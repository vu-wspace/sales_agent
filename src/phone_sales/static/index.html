<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tư vấn điện thoại</title>
<style>
  :root { --bg: #f5f6f8; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
          --accent: #0b6e4f; --me: #e7f3ee; --err: #b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --card: #1d2128; --text: #e6e8eb; --muted: #9aa1ab; --line: #2c323b;
            --accent: #3fb68b; --me: #1f3a30; --err: #f97066; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px;
           border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0; }
  button { font: inherit; cursor: pointer; border-radius: 8px; }
  #reset { background: none; border: 1px solid var(--line); color: var(--muted); padding: 4px 10px; }
  #log { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 10px; }
  /* Khung chat đầy thì cuộn, không co từng tin: thẻ có overflow: hidden (.receipt) sẽ bị ép dẹp, mất nội dung */
  #log > * { flex-shrink: 0; }
  /* Ẩn thanh cuộn nhưng vẫn cuộn được (chuột, bàn phím, cảm ứng) */
  #log, textarea { scrollbar-width: none; }
  #log::-webkit-scrollbar, textarea::-webkit-scrollbar { display: none; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; background: var(--card);
         border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
  .me { align-self: flex-end; background: var(--me); border-color: transparent; }
  /* Câu trả lời dạng markdown (renderMarkdown): đoạn, danh sách, chữ đậm cách đều nhau */
  .msg .p + .p, .msg .p + ul, .msg .p + ol, .msg ul + .p, .msg ol + .p { margin-top: 8px; }
  .msg ul, .msg ol { margin: 0; padding-left: 20px; }
  .msg li + li { margin-top: 4px; }
  .msg li::marker { color: var(--muted); }
  .msg strong { font-weight: 600; }
  .err { color: var(--err); }
  .msg a { color: var(--accent); overflow-wrap: anywhere; }
  #form { display: flex; gap: 8px; }
  #input { flex: 1; resize: none; font: inherit; padding: 10px 12px; border-radius: 8px;
             border: 1px solid var(--line); background: var(--card); color: var(--text); }
  #send { background: var(--accent); color: #fff; border: 0; padding: 0 18px; }
  #send:disabled { opacity: .6; cursor: wait; }
  /* Bong bóng đang chờ: dòng trạng thái + 3 chấm nhảy, rồi chữ hiện dần khi LLM viết */
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .dots span { display: inline-block; width: 5px; height: 5px; margin: 0 1px; border-radius: 50%;
               background: var(--muted); animation: blink 1.2s infinite both; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  .draft:not(:empty) { margin-top: 6px; }
  @media (prefers-reduced-motion: reduce) { .dots span { animation: none; opacity: .6; } }
  /* Form đặt hàng hiện trong khung chat khi agent gọi show_order_form (theo order_form.html) */
  .order { max-width: 85%; width: 420px; padding: 12px 14px; border-radius: 12px; background: var(--card);
           border: 1px solid var(--line); display: flex; flex-direction: column; font-size: 14px; }
  .order .item, .order .total { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
  .order .total { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 8px; font-weight: 600; }
  .order .disc { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; color: var(--accent); }
  .order .disc[hidden] { display: none; }
  /* Ô mã + nút cùng chiều cao: bỏ margin-top của input chung (nút cao hơn, lệch hàng) */
  .order .promo { display: flex; gap: 8px; align-items: stretch; margin-top: 4px; }
  /* [type=text]: cao hơn độ ưu tiên của rule input chung phía dưới (cùng độ ưu tiên thì rule sau thắng) */
  .order .promo input[type=text] { flex: 1; min-width: 0; margin-top: 0; text-transform: uppercase; }
  .order .promo input[readonly] { color: var(--accent); font-weight: 600; background: var(--me); }
  /* Độ rộng cố định: đổi chữ (Áp dụng / Kiểm tra… / Bỏ mã) không làm ô mã co giãn */
  .order .promo button.apply { flex: 0 0 104px; height: auto; padding: 0 10px; font-weight: 600; white-space: nowrap;
                               background: var(--card); color: var(--accent); border: 1px solid var(--accent); }
  .order .promo button.apply:hover:not(:disabled) { background: var(--me); }
  .order .promo button.apply:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .order .promo button.apply.remove { color: var(--muted); border-color: var(--line); font-weight: 400; }
  .order .promo-text { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .order .promo-text:empty { display: none; }
  .order .lbl { display: block; margin: 10px 0 4px; font-size: 13px; color: var(--muted); }
  .order input[type=text], .order input[type=tel], .order input[type=email], .order textarea {
    width: 100%; margin-top: 4px; padding: 8px 10px; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; resize: none; }
  .order input:focus, .order textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .order textarea:disabled { opacity: .6; cursor: not-allowed; }
  .order .ferr { margin: 4px 0 0; font-size: 13px; color: var(--err); }
  .order .ferr:empty { display: none; }
  .order .opts { display: flex; gap: 8px; }
  .order .opt { flex: 1; padding: 8px; text-align: center; font-size: 13px; border: 1px solid var(--line); border-radius: 8px; }
  .order .opt.on { border: 2px solid var(--accent); color: var(--accent); background: var(--me); }
  .order .dis { color: var(--muted); cursor: not-allowed; }
  .order .rad { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .order .tag { margin-left: auto; padding: 1px 8px; font-size: 12px; border-radius: 8px; color: var(--muted);
                background: var(--bg); }
  .order .row { display: flex; align-items: center; }
  .order .row .lbl { margin-bottom: 4px; }
  .order .actions { display: flex; gap: 8px; margin-top: 14px; }
  .order button { flex: 1; height: 40px; border: 0; background: var(--accent); color: #fff; }
  .order button.cancel { flex: 0 0 auto; padding: 0 16px; background: none; color: var(--text);
                         border: 1px solid var(--line); }
  .order button:disabled { opacity: .6; cursor: wait; }
  /* Thẻ xác nhận đơn sau khi gửi form: dữ liệu đọc từ database (POST /order trả về order) */
  .receipt { max-width: 85%; width: 420px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
             background: var(--card); font-size: 14px; }
  .receipt .head { padding: 14px; background: var(--me); }
  .receipt .title { font-weight: 600; font-size: 15px; }
  .receipt .code { color: var(--muted); font-size: 13px; }
  .receipt .code b { color: var(--text); font-family: ui-monospace, Consolas, monospace; letter-spacing: .5px; }
  .receipt section { padding: 12px 14px; border-top: 1px solid var(--line); }
  .receipt h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
                color: var(--muted); }
  .receipt dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; }
  .receipt dt { color: var(--muted); }
  .receipt dd { margin: 0; overflow-wrap: anywhere; }
  .receipt .line { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; }
  .receipt .line + .line { border-top: 1px dashed var(--line); }
  .receipt .variant, .receipt .qty { color: var(--muted); font-size: 13px; }
  .receipt .amount { text-align: right; white-space: nowrap; }
  .receipt .total { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 14px;
                    border-top: 1px solid var(--line); font-weight: 600; }
  .receipt .total span:last-child { color: var(--accent); font-size: 18px; }
  .receipt .sub { display: flex; justify-content: space-between; padding: 8px 14px 0; color: var(--muted); }
  .receipt .sub.off span:last-child { color: var(--accent); }
  .receipt .note { padding: 10px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tư vấn điện thoại</h1>
    <button id="reset" type="button">Cuộc trò chuyện mới</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <template id="order-tpl">
    <form class="order" novalidate>
      <div class="items"></div>
      <div class="disc" hidden><span class="disc-label">Giảm giá</span><span class="disc-amount"></span></div>
      <div class="total"><span>Tổng cộng</span><span class="sum"></span></div>
      <label class="lbl">Họ tên người nhận
        <input type="text" name="name" maxlength="100" placeholder="Nguyễn Văn A" autocomplete="name"></label>
      <p class="ferr" data-for="name"></p>
      <label class="lbl">Số điện thoại
        <input type="tel" name="phone" maxlength="20" placeholder="0123456789" autocomplete="tel"></label>
      <p class="ferr" data-for="phone"></p>
      <label class="lbl">Email (không bắt buộc)
        <input type="email" name="email" maxlength="254" placeholder="ten@example.com" autocomplete="email"></label>
      <p class="ferr" data-for="email"></p>
      <label class="lbl" for="promo-code">Mã khuyến mãi (nếu có)</label>
      <div class="promo">
        <input type="text" id="promo-code" name="promo" maxlength="50" placeholder="VD: GIAM500K" autocomplete="off">
        <button type="button" class="apply">Áp dụng</button>
      </div>
      <p class="promo-text"></p>
      <p class="ferr" data-for="promo"></p>
      <span class="lbl">Cách nhận hàng</span>
      <div class="opts">
        <div class="opt on">Giao tận nơi</div>
        <div class="opt dis" aria-disabled="true" title="Chưa hỗ trợ">Nhận tại cửa hàng</div>
      </div>
      <label class="lbl">Địa chỉ giao hàng
        <input type="text" name="address" maxlength="300" placeholder="123 Lê Hồng Phong, Quy Nhơn, Gia Lai"
               autocomplete="street-address"></label>
      <p class="ferr" data-for="address"></p>
      <span class="lbl">Thanh toán</span>
      <label class="rad"><input type="radio" name="payment" value="cod" checked> Thanh toán khi nhận hàng</label>
      <label class="rad dis"><input type="radio" name="payment" value="bank_transfer" disabled> Chuyển khoản
        <span class="tag">Chưa hỗ trợ</span></label>
      <label class="rad dis"><input type="radio" name="payment" value="installment" disabled> Trả góp 0%
        <span class="tag">Chưa hỗ trợ</span></label>
      <div class="row"><span class="lbl">Ghi chú</span><span class="tag">Chưa hỗ trợ</span></div>
      <textarea name="note" rows="2" disabled placeholder="Giao giờ hành chính, gọi trước khi giao..."></textarea>
      <p class="ferr" data-for="submit"></p>
      <div class="actions">
        <button type="button" class="cancel">Hủy đặt hàng</button>
        <button type="submit">Xác nhận đặt hàng</button>
      </div>
    </form>
  </template>
  <form id="form">
    <textarea id="input" rows="2" maxlength="1000" placeholder="Anh/chị đang tìm máy nào?" required></textarea>
    <button id="send">Gửi</button>
  </form>
</main>
<script>
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  let threadId = null;

  // Thêm text vào el, biến URL http(s) (dạng trần hoặc [chữ](url)) thành link mở tab mới.
  // Chỉ tạo text node / thẻ <a> có href http(s) -> không bị chèn HTML hay javascript:.
  function appendLinked(el, text) {
    const re = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<>()]+[^\s<>().,;:!?'"])/g;
    let last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) el.appendChild(document.createTextNode(text.slice(last, m.index)));
      const a = document.createElement('a');
      a.href = m[2] || m[3];
      a.textContent = m[1] || m[3];
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      el.appendChild(a);
      last = re.lastIndex;
    }
    if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
  }

  // Trong 1 dòng: **in đậm** và link; dấu ** lẻ (model quên đóng) thì bỏ, không hiện ra cho khách
  function renderInline(el, text) {
    text.split(/\*\*(.+?)\*\*/g).forEach((part, i) => {
      part = part.replace(/\*\*/g, '');
      if (!part) return;
      if (i % 2) {
        const b = document.createElement('strong');
        appendLinked(b, part);
        el.appendChild(b);
      } else {
        appendLinked(el, part);
      }
    });
  }

  // Model trả lời bằng markdown: đoạn chữ, danh sách "- " / "1. " thành <ul>/<ol> thật (dòng dài xuống hàng
  // thẳng lề với chữ, không lùi về sát mép), **in đậm**, link; bỏ dấu # của tiêu đề.
  // Dòng trống quanh danh sách bỏ đi: khoảng cách do CSS lo, câu nào cũng cách đều nhau.
  function renderMarkdown(div, text) {
    const LIST = /^\s*(?:([-*•])|(\d+)[.)])\s+(.*)$/;
    let para = [], list = null;
    const flushPara = () => {
      const t = para.join('\n').replace(/^\n+|\n+$/g, '');
      para = [];
      if (!t) return;
      const p = document.createElement('div');
      p.className = 'p';
      renderInline(p, t);
      div.appendChild(p);
    };
    for (const raw of text.replace(/^#{1,6}\s+/gm, '').split('\n')) {
      const m = raw.match(LIST);
      if (m) {
        flushPara();
        const tag = m[2] ? 'OL' : 'UL';
        if (!list || list.tagName !== tag) {
          list = document.createElement(tag);
          div.appendChild(list);
        }
        const li = document.createElement('li');
        renderInline(li, m[3]);
        list.appendChild(li);
      } else if (!raw.trim()) {
        // Dòng trống: giữa các mục thì vẫn là 1 danh sách; giữa 2 đoạn thì tách đoạn (cách nhau bằng CSS,
        // không để cả 1 dòng trống rộng gấp đôi chỗ khác)
        if (!list) flushPara();
      } else {
        list = null;
        para.push(raw);
      }
    }
    flushPara();
  }

  // Điền nội dung cho 1 bong bóng: tin của khách và lỗi giữ nguyên chữ, câu trả lời hiển thị markdown
  function fill(div, text, cls) {
    div.className = 'msg ' + (cls || '');
    div.replaceChildren();
    if (cls) div.textContent = text;
    else renderMarkdown(div, text);
    log.scrollTop = log.scrollHeight;
  }

  function add(text, cls) {
    const div = document.createElement('div');
    log.appendChild(div);
    fill(div, text, cls);
    return div;
  }

  // Bong bóng chờ: hiện ngay khi gửi, đổi dòng trạng thái khi agent chạy tool, chữ hiện dần ở .draft
  function addPending() {
    const div = document.createElement('div');
    div.className = 'msg';
    const status = document.createElement('div');
    status.className = 'status';
    const dots = document.createElement('span');
    dots.className = 'dots';
    dots.append(...[0, 1, 2].map(() => document.createElement('span')));
    const label = document.createElement('span');
    label.textContent = 'Em đang trả lời…';
    status.append(dots, label);
    const draft = document.createElement('div');
    draft.className = 'draft';
    div.append(status, draft);
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return { div, label, draft };
  }

  // Đọc Server-Sent Events từ /chat/stream: mỗi sự kiện là 1 dòng "data: {json}", cách nhau bằng dòng trống
  async function* readEvents(response) {
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) return;
      buf += decoder.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const raw = buf.slice(0, i);
        buf = buf.slice(i + 2);
        if (raw.startsWith('data: ')) yield JSON.parse(raw.slice(6));
      }
    }
  }

  const money = v => v.toLocaleString('vi-VN') + 'đ';

  // Form đặt hàng trong khung chat: giỏ hàng lấy từ state của agent; gửi form thì /order tạo đơn từ giỏ
  // của thread trên server (không dùng giỏ trình duyệt gửi lên) và trả tóm tắt đơn
  function addOrderForm(cart) {
    log.querySelectorAll('form.order').forEach(f => f.remove());  // giỏ đã đổi: form cũ không còn đúng
    const f = document.getElementById('order-tpl').content.firstElementChild.cloneNode(true);
    for (const i of cart) {
      const row = document.createElement('div');
      row.className = 'item';
      const name = document.createElement('span');
      name.textContent = `${i.quantity} x ${[i.name, i.storage, i.color].filter(Boolean).join(' · ')}`;
      const price = document.createElement('b');
      price.textContent = money(i.price * i.quantity);
      row.append(name, price);
      f.querySelector('.items').appendChild(row);
    }
    f.querySelector('.sum').textContent = money(cart.reduce((s, i) => s + i.price * i.quantity, 0));
    const err = key => f.querySelector(`.ferr[data-for="${key}"]`);
    let appliedCode = null;  // mã đã áp dụng thành công; gửi kèm khi đặt hàng (server kiểm tra lại)

    // Giá do server tính từ giỏ hàng của hội thoại: tạm tính, giảm giá (mã hoặc khuyến mãi tự động), tổng
    function showQuote(q) {
      const disc = f.querySelector('.disc');
      disc.hidden = !q.discount;
      f.querySelector('.disc-label').textContent = `Giảm giá${q.promo ? ` (${q.promo})` : ''}`;
      f.querySelector('.disc-amount').textContent = '-' + money(q.discount);
      f.querySelector('.sum').textContent = money(q.total);
      f.querySelector('.promo-text').textContent = q.promo_text || '';
    }
    async function quote(code) {
      const r = await fetch('/order/quote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ thread_id: threadId, promo_code: code || null }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Chưa kiểm tra được mã khuyến mãi.');
      return data;
    }
    quote(null).then(showQuote).catch(() => {});  // khuyến mãi tự động (nếu có) hiện ngay khi mở form
    // Enter trong ô mã: áp dụng mã, không gửi cả form đặt hàng
    f.elements.promo.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); f.querySelector('.apply').click(); }
    });
    // Nút có 2 trạng thái: "Áp dụng" (ô mã nhập được) và "Bỏ mã" (mã đã áp dụng, ô mã chỉ đọc)
    const applyBtn = f.querySelector('.apply');
    function setApplied(code) {
      appliedCode = code;
      f.elements.promo.readOnly = !!code;
      applyBtn.textContent = code ? 'Bỏ mã' : 'Áp dụng';
      applyBtn.classList.toggle('remove', !!code);
    }
    applyBtn.addEventListener('click', async () => {
      err('promo').textContent = '';
      if (appliedCode) {  // bỏ mã: quay về giá không mã (vẫn giữ khuyến mãi tự động nếu có)
        setApplied(null);
        f.elements.promo.value = '';
        f.elements.promo.focus();
        quote(null).then(showQuote).catch(() => {});
        return;
      }
      const code = f.elements.promo.value.trim().toUpperCase();
      if (!code) {
        err('promo').textContent = 'Nhập mã khuyến mãi';
        f.elements.promo.focus();
        return;
      }
      applyBtn.disabled = true;
      applyBtn.textContent = 'Kiểm tra…';
      try {
        showQuote(await quote(code));
        f.elements.promo.value = code;
        setApplied(code);
      } catch (ex) {
        setApplied(null);
        err('promo').textContent = ex.message;
        quote(null).then(showQuote).catch(() => {});  // mã sai: quay về giá không mã
      } finally {
        applyBtn.disabled = false;
      }
    });
    f.querySelectorAll('input').forEach(el => el.addEventListener('input', () => {
      if (err(el.name)) err(el.name).textContent = '';
    }));

    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = f.elements.name.value.trim();
      const phone = f.elements.phone.value.replace(/[\s.\-]/g, '');
      const address = f.elements.address.value.trim();
      const email = f.elements.email.value.trim();
      let ok = true;
      if (name.length < 2) { err('name').textContent = 'Nhập họ tên người nhận'; ok = false; }
      if (!/^(0|\+84)\d{9}$/.test(phone)) { err('phone').textContent = 'Số điện thoại chưa đúng định dạng'; ok = false; }
      if (address.length < 10) { err('address').textContent = 'Nhập địa chỉ đầy đủ hơn'; ok = false; }
      if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err('email').textContent = 'Email chưa đúng định dạng'; ok = false; }
      if (!ok) return;
      const button = f.querySelector('button[type=submit]');
      f.querySelector('.cancel').disabled = true;
      button.disabled = true;
      button.textContent = 'Đang gửi…';
      err('submit').textContent = '';
      let data;
      try {
        const r = await fetch('/order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ thread_id: threadId, name, phone, address, email: email || null, promo_code: appliedCode,
                                 fulfillment_type: 'delivery', payment: 'cod' }),
        });
        data = await r.json().catch(() => ({}));
        if (!r.ok) {
          throw new Error(typeof data.detail === 'string' ? data.detail
                          : 'Thông tin chưa hợp lệ, anh/chị kiểm tra lại giúp em.');
        }
      } catch (ex) {
        err('submit').textContent = ex.message || 'Không kết nối được máy chủ.';
        button.disabled = false;
        button.textContent = 'Xác nhận đặt hàng';
        f.querySelector('.cancel').disabled = false;
        return;
      }
      // Đơn đã tạo: bỏ form, hiện thẻ xác nhận; dựng thẻ lỗi thì vẫn hiện tóm tắt dạng chữ, không để trống
      f.remove();
      add('Đã gửi thông tin đặt hàng', 'me');
      try {
        addReceipt(data.order);
        add(data.thanks);
      } catch (ex) {
        console.error('Không dựng được thẻ xác nhận đơn', ex);
        log.querySelector('.receipt:last-child')?.remove();
        add(data.answer || 'Đơn hàng đã được tạo.');
      }
    });

    // Hủy: không tạo đơn, máy chủ ghi vào lịch sử hội thoại câu xác nhận cố định và làm trống giỏ hàng
    f.querySelector('.cancel').addEventListener('click', async (e) => {
      const cancel = e.currentTarget;
      const submit = f.querySelector('button[type=submit]');
      cancel.disabled = submit.disabled = true;
      cancel.textContent = 'Đang hủy…';
      err('submit').textContent = '';
      try {
        const r = await fetch('/order/cancel', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ thread_id: threadId }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Chưa hủy được, anh/chị thử lại giúp em.');
        f.remove();
        add('Hủy đặt hàng', 'me');
        add(data.answer);
        input.focus();
      } catch (ex) {
        err('submit').textContent = ex.message || 'Không kết nối được máy chủ.';
        cancel.disabled = submit.disabled = false;
        cancel.textContent = 'Hủy đặt hàng';
      }
    });
    log.appendChild(f);
    log.scrollTop = log.scrollHeight;
    f.elements.name.focus();
  }

  // Tạo thẻ với class và chữ (textContent: dữ liệu khách nhập không bị hiểu thành HTML)
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // 0912345678 -> 0912 345 678 cho dễ đọc
  const prettyPhone = p => /^0\d{9}$/.test(p) ? p.replace(/^(\d{4})(\d{3})(\d{3})$/, '$1 $2 $3') : p;

  function addReceipt(o) {
    const card = el('div', 'receipt');
    const head = el('div', 'head');
    const code = el('div', 'code', 'Mã đơn ');
    code.appendChild(el('b', '', '#' + o.order_id));
    head.append(el('div', 'title', 'Đặt hàng thành công'), code);

    const info = el('section');
    const dl = el('dl');
    const rows = [['Người nhận', o.name], ['Điện thoại', prettyPhone(o.phone)], ['Email', o.email],
                  ['Địa chỉ', o.address], ['Nhận hàng', o.fulfillment], ['Thanh toán', o.payment]];
    for (const [k, v] of rows.filter(([, v]) => v)) {  // không nhập email thì không có dòng Email
      dl.append(el('dt', '', k), el('dd', '', v));
    }
    info.append(el('h3', '', 'Thông tin nhận hàng'), dl);

    const items = el('section');
    items.appendChild(el('h3', '', `Sản phẩm (${o.items.reduce((s, i) => s + i.qty, 0)})`));
    for (const i of o.items) {
      const line = el('div', 'line');
      const left = el('div');
      left.appendChild(el('div', '', i.name));
      if (i.variant) left.appendChild(el('div', 'variant', i.variant));
      const right = el('div', 'amount');
      right.append(el('div', '', money(i.unit_price * i.qty)), el('div', 'qty', `${i.qty} x ${money(i.unit_price)}`));
      line.append(left, right);
      items.appendChild(line);
    }

    const total = el('div', 'total');
    total.append(el('span', '', 'Tổng cộng'), el('span', '', money(o.total)));
    const subs = [];
    if (o.discount) {  // có khuyến mãi: tạm tính + dòng giảm giá trước tổng
      const sub = el('div', 'sub');
      sub.append(el('span', '', 'Tạm tính'), el('span', '', money(o.subtotal)));
      const off = el('div', 'sub off');
      off.append(el('span', '', `Giảm giá${o.promo ? ` (${o.promo})` : ''}`), el('span', '', '-' + money(o.discount)));
      subs.push(sub, off);
    }
    card.append(head, info, items, ...subs, total, el('div', 'note', o.note));
    log.appendChild(card);
    log.scrollTop = log.scrollHeight;
  }

  function greet() {
    log.replaceChildren();
    threadId = null;
    add('Dạ, em chào anh/chị. Bên em tư vấn iPhone, Samsung Galaxy, phụ kiện đi kèm, giá và tình trạng hàng, cùng chính sách đổi trả, giao hàng, trả góp và bảo hành. Anh/chị cần gì cứ hỏi em nha.');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    add(message, 'me');
    input.value = '';
    send.disabled = true;
    const pending = addPending();
    let draft = '';
    try {
      const r = await fetch('/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, thread_id: threadId }),
      });
      if (!r.ok) {  // lỗi trước khi stream bắt đầu (vd 422 tin nhắn quá dài)
        const data = await r.json().catch(() => ({}));
        throw new Error(typeof data.detail === 'string' ? data.detail : 'Có lỗi xảy ra.');
      }
      let finished = false;
      for await (const ev of readEvents(r)) {
        if (ev.type === 'start') threadId = ev.thread_id;
        else if (ev.type === 'status') pending.label.textContent = ev.text;
        else if (ev.type === 'reset') { draft = ''; pending.draft.textContent = ''; }
        else if (ev.type === 'token') {
          draft += ev.text;
          pending.draft.textContent = draft;  // chữ thô trong lúc viết; xong mới hiển thị markdown
          log.scrollTop = log.scrollHeight;
        } else if (ev.type === 'done') {
          threadId = ev.thread_id;
          fill(pending.div, ev.answer, '');
          if (ev.order_form && ev.cart.length) addOrderForm(ev.cart);
          finished = true;
        } else if (ev.type === 'error') throw new Error(ev.detail || 'Có lỗi xảy ra.');
      }
      if (!finished) throw new Error('Mất kết nối giữa chừng, anh/chị gửi lại giúp em nha.');
    } catch (err) {
      fill(pending.div, err.message || 'Không kết nối được máy chủ.', 'err');
    } finally {
      send.disabled = false;
      input.focus();
    }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  document.getElementById('reset').addEventListener('click', greet);
  greet();
</script>
</body>
