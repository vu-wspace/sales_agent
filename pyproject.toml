# 4 package Python, mỗi service là 1 project uv độc lập với uv.lock riêng (services/agent, services/be, services/zalo):
#   packages/common  (phone-common): tiện ích dùng chung - LLM + fallback, mã hóa/che PII, chuẩn hóa chữ tiếng Việt
#   services/agent   (phone-agent):  LangGraph agent + HTTP API (cổng 8001), Qdrant, embedding (torch), Postgres riêng
#   services/be      (phone-api):    đơn hàng, khuyến mãi, chính sách, phiên chat, email; gọi agent qua HTTP (cổng 8002)
#   services/zalo    (phone-zalo):   adapter Zalo OA, chỉ gọi be qua HTTP (cổng 8003)
#   services/fe      : nginx phục vụ giao diện, chuyển /chat, /order, /session sang be (cổng 8000), không có Python
# File này (và uv.lock ở gốc) chỉ để chạy test/eval trên máy: cài cả 4 package dạng editable. Docker không dùng.
#   uv sync
[project]
name = "sales-agent-dev"
version = "0.1.0"
requires-python = ">=3.12.15"
dependencies = ["phone-common", "phone-agent", "phone-api", "phone-zalo"]

[tool.uv]
package = false

[tool.uv.sources]
phone-common = { path = "packages/common", editable = true }
phone-agent = { path = "services/agent", editable = true }
phone-api = { path = "services/be", editable = true }
phone-zalo = { path = "services/zalo", editable = true }
# torch bản CPU (không kéo CUDA ~ vài GB)
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.8",
    "pytest>=8.4.0",
    "pandas>=3.1.0",   # evals/run_eval.py
]
