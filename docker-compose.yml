services:
  qdrant:
    image: qdrant/qdrant:v1.20.0   # ghim phiên bản, khớp qdrant-client trong pyproject.toml
    container_name: qdrant
    networks: [vector]
    ports:
      - "127.0.0.1:6333:6333"   # REST API + dashboard (cũng dùng khi chạy code trên máy, không Docker)
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage   # Docker volume: dữ liệu còn khi xóa container, mất khi `down -v`
    restart: unless-stopped

  postgres:
    image: postgres:18.6-bookworm   # khớp bản pg_dump đã tạo data_schema/phone.sql
    container_name: phone_db
    networks: [database]
    ports:
      - "127.0.0.1:5433:5432"   # 5432 thường đã bị Postgres cài trên máy chiếm
    environment:
      POSTGRES_USER: postgres       # phone.sql gán OWNER TO postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}   # đặt trong .env; mặc định chỉ dùng cho demo
      POSTGRES_DB: phone
    volumes:
      - postgres_data:/var/lib/postgresql   # postgres 18 lưu dữ liệu ở /var/lib/postgresql/18/docker
      # Chỉ chạy khi volume rỗng (lần đầu), theo thứ tự tên file: tạo bảng rồi nạp dữ liệu.
      # Cào lại dữ liệu thì nạp tay (xem README) hoặc `docker compose down -v` để khởi tạo lại.
      - ./data_schema/phone.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data_schema/output/phone_seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      # Bảng khách hàng, đơn hàng; be cũng tự tạo khi khởi động nên volume cũ không cần làm gì
      - ./data_schema/orders.sql:/docker-entrypoint-initdb.d/03-orders.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d phone"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Database riêng của agent (không dùng chung với be): lịch sử hội thoại, giỏ hàng, lượt đang chạy.
  # Agent tự tạo bảng khi khởi động. Mạng agentdb chỉ có agent, be không chạm tới được.
  agent-db:
    image: postgres:18.6-bookworm
    container_name: phone_agent_db
    networks: [agentdb]
    ports:
      - "127.0.0.1:5434:5432"   # chạy agent trên máy (không Docker): AGENT_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5434/agent
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AGENT_DB_PASSWORD:-postgres}   # đặt trong .env; mặc định chỉ dùng cho demo
      POSTGRES_DB: agent
    volumes:
      - agent_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Nạp lại dữ liệu sản phẩm sau khi cào lại (TRUNCATE + INSERT, không mất volume):
  #   docker compose run --rm db-seed
  # Thuộc profile "tools" nên `docker compose up` không tự chạy service này.
  db-seed:
    image: postgres:18.6-bookworm
    profiles: ["tools"]
    networks: [database]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./data_schema/output/phone_seed.sql:/seed/phone_seed.sql:ro
    command: ["psql", "-h", "postgres", "-U", "postgres", "-d", "phone", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/seed/phone_seed.sql"]
    depends_on:
      postgres:
        condition: service_healthy

  # Agent tư vấn (LangGraph): giữ lịch sử hội thoại + giỏ hàng. Mở cổng 8001 cho hệ thống khác tích hợp
  # (docs tại http://localhost:8001/docs); mở ra ngoài mạng nội bộ thì đặt AGENT_API_KEY trong .env.
  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    image: phone-sales-agent
    container_name: phone_agent
    networks: [default, vector, agentdb]
    ports:
      - "127.0.0.1:8001:8001"   # chỉ máy này gọi được; khách đi qua fe (8000), không tới thẳng agent
    environment:
      QDRANT_URL: http://qdrant:6333
      AGENT_DATABASE_URL: postgresql://postgres:${AGENT_DB_PASSWORD:-postgres}@agent-db:5432/agent
      BE_URL: http://be:8002
      AGENT_API_KEY: "${AGENT_API_KEY:-}"
      # Key riêng cho từng hệ thống tích hợp, vd "zalo:<key ngẫu nhiên>:120" (xem README, API của agent); cần AGENT_API_KEY
      AGENT_CLIENT_KEYS: "${AGENT_CLIENT_KEYS:-}"
      AGENT_CLIENT_RATE_PER_MIN: "${AGENT_CLIENT_RATE_PER_MIN:-60}"
      CATALOG_API_KEY: "${CATALOG_API_KEY:-}"
      AGENT_IMPL: "${AGENT_IMPL:-graph}"
      ROUTER9_API_KEY: "${ROUTER9_API_KEY:-}"
      ROUTER9_MODEL: "${ROUTER9_MODEL:-agy/gemini-3.8-flash-medium}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      LANGSMITH_TRACING: "${LANGSMITH_TRACING:-false}"
      LANGSMITH_ENDPOINT: "${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}"
      LANGSMITH_API_KEY: "${LANGSMITH_API_KEY:-}"
      LANGSMITH_PROJECT: "${LANGSMITH_PROJECT:-phone-sales-agent}"
      ROUTER9_BASE_URL: http://host.docker.internal:20128/v1   # 9Router chạy trên máy host, không phải trong container
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux cần dòng này; Docker Desktop (Windows/Mac) có sẵn
    depends_on:
      qdrant:
        condition: service_started
      agent-db:
        condition: service_healthy
      be:
        condition: service_started
    restart: unless-stopped

  # Backend cửa hàng: đơn hàng, phiên chat, email, chính sách (bản gốc, đẩy sang agent); chuyển chat sang agent.
  # Agent tắt thì be vẫn chạy.
  be:
    build:
      context: .
      dockerfile: services/be/Dockerfile
    image: phone-sales-be
    container_name: phone_be
    networks: [default, database]
    ports:
      - "127.0.0.1:8002:8002"   # API (docs tại /docs); chỉ máy này: ngoài LAN gọi thẳng be thì tự khai X-Forwarded-For được, lách giới hạn chat theo IP
    env_file: .env    # PII_KEY, SMTP_*, MAIL_FROM, LLM key (lời cảm ơn sau đặt hàng), AGENT_API_KEY, ADMIN_API_KEY
    environment:
      AGENT_URL: http://agent:8001
      # Tin X-Forwarded-For từ mạng docker (nginx của fe) để giới hạn chat theo IP thật của khách
      FORWARDED_ALLOW_IPS: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/phone
      ROUTER9_BASE_URL: http://host.docker.internal:20128/v1
      SMTP_HOST: mailpit                                       # ghi đè SMTP_HOST=localhost trong .env
      SMTP_PORT: "1025"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  # Giao diện chat: nginx phục vụ HTML, chuyển /chat, /order, /session sang be
  fe:
    build: services/fe
    image: phone-sales-fe
    container_name: phone_fe
    ports:
      - "8000:80"     # Web chat: http://localhost:8000
    environment:
      BE_URL: http://be:8002   # be chạy trên máy (không Docker): http://host.docker.internal:8002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - be
    restart: unless-stopped

  # Bắt email khi phát triển: mọi email gửi tới cổng 1025 được giữ lại, xem tại http://localhost:8025,
  # không đi ra Internet. Chạy thật thì bỏ service này và đặt SMTP_* trỏ tới nhà cung cấp email.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: phone_mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # giao diện web
    restart: unless-stopped

networks:
  database:
  vector:
  agentdb:

volumes:
  qdrant_data:
  postgres_data:
  agent_db_data:
