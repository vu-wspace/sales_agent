# uv workspace: 3 package Python, mỗi service cài riêng thư viện của mình
#   packages/common  (phone-common): config, LLM + fallback, PII, khuyến mãi, chuẩn hóa chữ - agent và be dùng chung
#   services/agent   (phone-agent):  LangGraph agent + HTTP API (cổng 8001), Qdrant, embedding (torch)
#   services/be      (phone-api):    đơn hàng, phiên chat, email; gọi agent qua HTTP (cổng 8002), không kéo torch
#   services/fe      : nginx phục vụ giao diện, chuyển /chat, /order, /session sang be (cổng 8000), không có Python
# Cài tất cả để chạy test/eval trên máy: uv sync --all-packages
[tool.uv.workspace]
members = ["packages/common", "services/agent", "services/be"]

[tool.uv.sources]
phone-common = { workspace = true }
phone-agent = { workspace = true }
phone-api = { workspace = true }
# torch bản CPU (không kéo CUDA ~ vài GB khi build Docker trên Linux)
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.8",
    "pytest>=8.4.0",
    "pandas>=3.1.0",   # evals/run_eval.py
]
