services:
  qdrant:
    image: qdrant/qdrant:v1.20.0   # ghim phiên bản, khớp qdrant-client trong pyproject.toml
    container_name: qdrant
    ports:
      - "6333:6333"   # REST API + dashboard (cũng dùng khi chạy code trên máy, không Docker)
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage   # Docker volume: dữ liệu còn khi xóa container, mất khi `down -v`
    restart: unless-stopped

  postgres:
    image: postgres:18.6-bookworm   # khớp bản pg_dump đã tạo data_schema/phone.sql
    container_name: phone_db
    ports:
      - "5433:5432"   # 5432 thường đã bị Postgres cài trên máy chiếm
    environment:
      POSTGRES_USER: postgres       # phone.sql gán OWNER TO postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}   # đặt trong .env; mặc định chỉ dùng cho demo
      POSTGRES_DB: phone
    volumes:
      - postgres_data:/var/lib/postgresql   # postgres 18 lưu dữ liệu ở /var/lib/postgresql/18/docker
      # Chỉ chạy khi volume rỗng (lần đầu), theo thứ tự tên file: tạo bảng rồi nạp dữ liệu.
      # Cào lại dữ liệu thì nạp tay (xem README) hoặc `docker compose down -v` để khởi tạo lại.
      - ./data_schema/phone.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data_schema/output/phone_seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      # Bảng khách hàng, đơn hàng; be cũng tự tạo khi khởi động nên volume cũ không cần làm gì
      - ./data_schema/orders.sql:/docker-entrypoint-initdb.d/03-orders.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d phone"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Nạp lại dữ liệu sản phẩm sau khi cào lại (TRUNCATE + INSERT, không mất volume):
  #   docker compose run --rm db-seed
  # Thuộc profile "tools" nên `docker compose up` không tự chạy service này.
  db-seed:
    image: postgres:18.6-bookworm
    profiles: ["tools"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./data_schema/output/phone_seed.sql:/seed/phone_seed.sql:ro
    command: ["psql", "-h", "postgres", "-U", "postgres", "-d", "phone", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/seed/phone_seed.sql"]
    depends_on:
      postgres:
        condition: service_healthy

  # Agent tư vấn (LangGraph): giữ lịch sử hội thoại + giỏ hàng. Mở cổng 8001 cho hệ thống khác tích hợp
  # (docs tại http://localhost:8001/docs); mở ra ngoài mạng nội bộ thì đặt AGENT_API_KEY trong .env.
  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    image: phone-sales-agent
    container_name: phone_agent
    ports:
      - "8001:8001"
    env_file: .env    # ROUTER9_*, OPENROUTER_API_KEY, GOOGLE_API_KEY, GROQ_API_KEY, TAVILY_API_KEY, LANGSMITH_*, AGENT_API_KEY
    environment:
      QDRANT_URL: http://qdrant:6333   # ghi đè QDRANT_URL=localhost trong .env
      AUTO_INGEST: "true"              # collection rỗng thì tự nạp chính sách (data_schema/policies) khi khởi động
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/phone   # tool tra sản phẩm
      ROUTER9_BASE_URL: http://host.docker.internal:20128/v1   # 9Router chạy trên máy host, không phải trong container
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux cần dòng này; Docker Desktop (Windows/Mac) có sẵn
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Backend cửa hàng: đơn hàng, phiên chat, email; chuyển chat sang agent. Agent tắt thì be vẫn chạy.
  be:
    build:
      context: .
      dockerfile: services/be/Dockerfile
    image: phone-sales-be
    container_name: phone_be
    ports:
      - "8002:8002"   # API (docs tại /docs)
    env_file: .env    # PII_KEY, SMTP_*, MAIL_FROM, LLM key (lời cảm ơn sau đặt hàng), AGENT_API_KEY
    environment:
      AGENT_URL: http://agent:8001
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/phone
      ROUTER9_BASE_URL: http://host.docker.internal:20128/v1
      SMTP_HOST: mailpit                                       # ghi đè SMTP_HOST=localhost trong .env
      SMTP_PORT: "1025"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  # Giao diện chat: nginx phục vụ HTML, chuyển /chat, /order, /session sang be
  fe:
    build: services/fe
    image: phone-sales-fe
    container_name: phone_fe
    ports:
      - "8000:80"     # Web chat: http://localhost:8000
    environment:
      BE_URL: http://be:8002   # be chạy trên máy (không Docker): http://host.docker.internal:8002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - be
    restart: unless-stopped

  # Bắt email khi phát triển: mọi email gửi tới cổng 1025 được giữ lại, xem tại http://localhost:8025,
  # không đi ra Internet. Chạy thật thì bỏ service này và đặt SMTP_* trỏ tới nhà cung cấp email.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: phone_mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # giao diện web
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
