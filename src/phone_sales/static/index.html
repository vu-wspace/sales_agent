<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tư vấn điện thoại</title>
<style>
  :root { --bg: #f5f6f8; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
          --accent: #0b6e4f; --me: #e7f3ee; --err: #b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --card: #1d2128; --text: #e6e8eb; --muted: #9aa1ab; --line: #2c323b;
            --accent: #3fb68b; --me: #1f3a30; --err: #f97066; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px;
           border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0; }
  button { font: inherit; cursor: pointer; border-radius: 8px; }
  #reset { background: none; border: 1px solid var(--line); color: var(--muted); padding: 4px 10px; }
  #log { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 10px; }
  /* Ẩn thanh cuộn nhưng vẫn cuộn được (chuột, bàn phím, cảm ứng) */
  #log, textarea { scrollbar-width: none; }
  #log::-webkit-scrollbar, textarea::-webkit-scrollbar { display: none; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; background: var(--card);
         border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
  .me { align-self: flex-end; background: var(--me); border-color: transparent; }
  .err { color: var(--err); }
  .msg a { color: var(--accent); overflow-wrap: anywhere; }
  form { display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; font: inherit; padding: 10px 12px; border-radius: 8px;
             border: 1px solid var(--line); background: var(--card); color: var(--text); }
  #send { background: var(--accent); color: #fff; border: 0; padding: 0 18px; }
  #send:disabled { opacity: .6; cursor: wait; }
  /* Bong bóng đang chờ: dòng trạng thái + 3 chấm nhảy, rồi chữ hiện dần khi LLM viết */
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .dots span { display: inline-block; width: 5px; height: 5px; margin: 0 1px; border-radius: 50%;
               background: var(--muted); animation: blink 1.2s infinite both; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  .draft:not(:empty) { margin-top: 6px; }
  @media (prefers-reduced-motion: reduce) { .dots span { animation: none; opacity: .6; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tư vấn điện thoại</h1>
    <button id="reset" type="button">Cuộc trò chuyện mới</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <textarea id="input" rows="2" maxlength="1000" placeholder="Anh/chị đang tìm máy nào ạ?" required></textarea>
    <button id="send">Gửi</button>
  </form>
</main>
<script>
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  let threadId = null;

  // Thêm text vào el, biến URL http(s) (dạng trần hoặc [chữ](url)) thành link mở tab mới.
  // Chỉ tạo text node / thẻ <a> có href http(s) -> không bị chèn HTML hay javascript:.
  function appendLinked(el, text) {
    const re = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<>()]+[^\s<>().,;:!?'"])/g;
    let last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) el.appendChild(document.createTextNode(text.slice(last, m.index)));
      const a = document.createElement('a');
      a.href = m[2] || m[3];
      a.textContent = m[1] || m[3];
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      el.appendChild(a);
      last = re.lastIndex;
    }
    if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
  }

  // Model trả lời bằng markdown: hiển thị **in đậm** và link, bỏ dấu # của tiêu đề.
  function renderMarkdown(div, text) {
    text = text.replace(/^#{1,6}\s+/gm, '');
    text.split(/\*\*(.+?)\*\*/g).forEach((part, i) => {
      if (!part) return;
      if (i % 2) {
        const b = document.createElement('strong');
        appendLinked(b, part);
        div.appendChild(b);
      } else {
        appendLinked(div, part);
      }
    });
  }

  // Điền nội dung cho 1 bong bóng: tin của khách và lỗi giữ nguyên chữ, câu trả lời hiển thị markdown
  function fill(div, text, cls) {
    div.className = 'msg ' + (cls || '');
    div.replaceChildren();
    if (cls) div.textContent = text;
    else renderMarkdown(div, text);
    log.scrollTop = log.scrollHeight;
  }

  function add(text, cls) {
    const div = document.createElement('div');
    log.appendChild(div);
    fill(div, text, cls);
    return div;
  }

  // Bong bóng chờ: hiện ngay khi gửi, đổi dòng trạng thái khi agent chạy tool, chữ hiện dần ở .draft
  function addPending() {
    const div = document.createElement('div');
    div.className = 'msg';
    const status = document.createElement('div');
    status.className = 'status';
    const dots = document.createElement('span');
    dots.className = 'dots';
    dots.append(...[0, 1, 2].map(() => document.createElement('span')));
    const label = document.createElement('span');
    label.textContent = 'Em đang trả lời…';
    status.append(dots, label);
    const draft = document.createElement('div');
    draft.className = 'draft';
    div.append(status, draft);
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return { div, label, draft };
  }

  // Đọc Server-Sent Events từ /chat/stream: mỗi sự kiện là 1 dòng "data: {json}", cách nhau bằng dòng trống
  async function* readEvents(response) {
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) return;
      buf += decoder.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const raw = buf.slice(0, i);
        buf = buf.slice(i + 2);
        if (raw.startsWith('data: ')) yield JSON.parse(raw.slice(6));
      }
    }
  }

  function greet() {
    log.replaceChildren();
    threadId = null;
    add('Dạ em chào anh/chị. Em có thể tư vấn iPhone, Samsung Galaxy, phụ kiện tương thích, giá và tình trạng hàng, cùng các chính sách đổi trả, giao hàng, trả góp và bảo hành ạ.');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    add(message, 'me');
    input.value = '';
    send.disabled = true;
    const pending = addPending();
    let draft = '';
    try {
      const r = await fetch('/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, thread_id: threadId }),
      });
      if (!r.ok) {  // lỗi trước khi stream bắt đầu (vd 422 tin nhắn quá dài)
        const data = await r.json().catch(() => ({}));
        throw new Error(typeof data.detail === 'string' ? data.detail : 'Có lỗi xảy ra.');
      }
      let finished = false;
      for await (const ev of readEvents(r)) {
        if (ev.type === 'start') threadId = ev.thread_id;
        else if (ev.type === 'status') pending.label.textContent = ev.text;
        else if (ev.type === 'reset') { draft = ''; pending.draft.textContent = ''; }
        else if (ev.type === 'token') {
          draft += ev.text;
          pending.draft.textContent = draft;  // chữ thô trong lúc viết; xong mới hiển thị markdown
          log.scrollTop = log.scrollHeight;
        } else if (ev.type === 'done') {
          threadId = ev.thread_id;
          fill(pending.div, ev.answer, '');
          finished = true;
        } else if (ev.type === 'error') throw new Error(ev.detail || 'Có lỗi xảy ra.');
      }
      if (!finished) throw new Error('Mất kết nối giữa chừng, anh/chị vui lòng gửi lại.');
    } catch (err) {
      fill(pending.div, err.message || 'Không kết nối được máy chủ.', 'err');
    } finally {
      send.disabled = false;
      input.focus();
    }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  document.getElementById('reset').addEventListener('click', greet);
  greet();
</script>
</body>
</html>
